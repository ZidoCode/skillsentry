[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillsentry"
version = "0.1.1"
description = "Gate agent skills and plugins before install: hash pinning, capability drift, and payload scanning."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ZidoCode" }]
keywords = ["ai-agents", "agent-skills", "security", "supply-chain", "sarif"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
skillsentry = "skillsentry.cli:main"

[tool.setuptools]
packages = ["skillsentry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
