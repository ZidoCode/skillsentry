name: "skillsentry scan"
description: "Gate agent skills and plugins before install: payload scan, capability drift, SARIF output."
author: "ZidoCode"
branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "File or directory to scan."
    required: false
    default: "."
  min-severity:
    description: "Lowest severity that fails the job (low, medium, high, critical)."
    required: false
    default: "medium"
  args:
    description: "Extra arguments passed to `skillsentry check` (for example --format sarif -o results.sarif)."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install skillsentry
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH"

    - name: Scan skills
      shell: bash
      run: |
        skillsentry check "${{ inputs.path }}" \
          --min-severity "${{ inputs.min-severity }}" \
          ${{ inputs.args }}
