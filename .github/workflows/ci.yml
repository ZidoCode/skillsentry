name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q
      - name: Install package
        run: python -m pip install --quiet .
      - name: Entry point works
        run: skillsentry rules

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --quiet .
      - name: Self-scan (rules and fixtures are excluded on purpose)
        run: |
          skillsentry check . \
            --exclude 'skillsentry/rules.py' \
            --exclude 'tests/*' \
            --min-severity medium
